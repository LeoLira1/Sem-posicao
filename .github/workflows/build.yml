name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Scaffold Android
        run: |
          flutter create --org com.camda --project-name sem_posicao /tmp/scaffold
          M=/tmp/scaffold/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="sem_posicao"/android:label="Sem Posição"/' "$M"
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          cp -r /tmp/scaffold/android .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Sem Posição #${{ github.run_number }}"
          body: |
            Lista de produtos sem posição no app Gôndolas.
            **Primeiro uso:** toque em ⚙️ e informe URL + token do mesmo banco Turso do Gôndolas.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
